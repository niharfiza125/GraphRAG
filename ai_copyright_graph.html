<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Copyright & Governance — Knowledge Graph</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:           #0a0e1a;
    --surface:      #111827;
    --border:       #1e2d45;
    --text:         #e2e8f0;
    --text-muted:   #64748b;
    --accent:       #38bdf8;

    --c-org:        #4ECDC4;
    --c-person:     #FF6B6B;
    --c-leg:        #60a5fa;
    --c-case:       #FBBF24;
    --c-concept:    #86efac;
    --c-gov:        #c084fc;
    --c-ai:         #fb923c;
    --c-other:      #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stats {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  .stats span { color: var(--text); }

  /* ── Layout ──────────────────────────────────────────────────── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  /* ── Legend items ────────────────────────────────────────────── */
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }

  .legend-item:hover { background: rgba(255,255,255,0.04); }
  .legend-item.disabled { opacity: 0.3; }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-name {
    font-size: 12px;
    color: var(--text);
    flex: 1;
  }

  .legend-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ── Search ──────────────────────────────────────────────────── */
  .search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }

  input[type="search"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--text-muted); }

  /* ── Controls ────────────────────────────────────────────────── */
  .controls { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

  .control-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .btn-row { display: flex; gap: 6px; margin-top: 4px; }

  button {
    flex: 1;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Canvas ──────────────────────────────────────────────────── */
  #graph-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg { width: 100%; height: 100%; }

  /* ── Links ───────────────────────────────────────────────────── */
  .link {
    stroke: #1e3a5f;
    stroke-opacity: 0.7;
    stroke-width: 1.5px;
    transition: stroke 0.2s, stroke-opacity 0.2s;
  }

  .link.highlighted { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2px; }
  .link.dimmed      { stroke-opacity: 0.08; }

  /* ── Edge labels ─────────────────────────────────────────────── */
  .edge-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    fill: #334155;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .edge-label.visible { opacity: 1; }

  /* ── Nodes ───────────────────────────────────────────────────── */
  .node circle {
    stroke: rgba(255,255,255,0.15);
    stroke-width: 1.5px;
    cursor: pointer;
    transition: stroke 0.15s, stroke-width 0.15s, filter 0.15s;
  }

  .node circle:hover {
    stroke: white;
    stroke-width: 2.5px;
    filter: brightness(1.3);
  }

  .node.selected circle { stroke: white; stroke-width: 3px; filter: brightness(1.4); }
  .node.dimmed circle   { opacity: 0.12; }
  .node.dimmed text     { opacity: 0.05; }

  .node text {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    fill: var(--text);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
    transition: opacity 0.2s;
  }

  /* ── Tooltip ─────────────────────────────────────────────────── */
  #tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 260px;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  #tooltip.visible { opacity: 1; }

  .tt-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
    color: var(--text);
  }

  .tt-type {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .tt-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .tt-connections {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 6px;
    margin-top: 4px;
  }

  .tt-connections span { color: var(--accent); }
</style>
</head>

<header>
  <h1>Knowledge Graph — AI Copyright &amp; Governance</h1>
  <div class="stats">
    nodes <span id="stat-nodes">—</span> &nbsp;|&nbsp;
    edges <span id="stat-edges">—</span> &nbsp;|&nbsp;
    communities <span id="stat-communities">—</span>
  </div>
</header>

<div class="layout">

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="search-wrap">
      <input type="search" id="search" placeholder="Search nodes…">
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Entity Types</div>
      <div id="legend"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Controls</div>
      <div class="controls">
        <div class="control-row">
          <div class="control-label">Link distance</div>
          <input type="range" id="link-distance" min="40" max="300" value="120">
        </div>
        <div class="control-row">
          <div class="control-label">Charge strength</div>
          <input type="range" id="charge" min="-800" max="-50" value="-300">
        </div>
        <div class="control-row">
          <div class="control-label">Edge labels</div>
          <input type="range" id="label-threshold" min="0" max="10" value="3"
                 title="Show labels on edges connecting nodes with degree ≥ this value">
        </div>
        <div class="btn-row">
          <button id="btn-reset">Reset zoom</button>
          <button id="btn-all">Show all</button>
        </div>
      </div>
    </div>

  </aside>

  <!-- ── Graph canvas ────────────────────────────────── -->
  <div id="graph-container">
    <svg id="graph">
      <defs>
        <marker id="arrow" viewBox="0 -4 10 8" refX="18" refY="0"
                markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,-4L10,0L0,4" fill="#1e3a5f"/>
        </marker>
      </defs>
      <g id="root"></g>
    </svg>
    <div id="tooltip"></div>
  </div>

</div>

, {"source": "CREATIVITY", "target": "ORIGINALITY REQUIREMENT", "label": "REFERENCES", "description": "The legal originality requirement explicitly relies on the legal and conceptual definition of creativity."}, {"source": "AESTHETIC NEUTRALITY DOCTRINE", "target": "SOURCE INDIFFERENCE PRINCIPLE", "label": "REFERENCES", "description": "The proposed source indifference principle is derived from the established aesthetic neutrality doctrine in legal philosophy."}, {"source": "OLIVER WENDELL HOLMES", "target": "BLEISTEIN V. DONALDSON LITHOGRAPHING CO.", "label": "REFERENCES", "description": "Justice Oliver Wendell Holmes authored the famous majority quote in Bleistein v. Donaldson Lithographing Co."}, {"source": "BLEISTEIN V. DONALDSON LITHOGRAPHING CO.", "target": "AESTHETIC NEUTRALITY", "label": "REFERENCES", "description": "The legal case Bleistein v. Donaldson Lithographing Co. established the doctrine of aesthetic neutrality."}, {"source": "SOURCE INDIFFERENCE PRINCIPLE", "target": "ARTISTIC TURING TEST", "label": "REFERENCES", "description": "The source indifference principle applies when works pass the Artistic Turing Test because observers cannot distinguish between human and AI origins."}, {"source": "GAI", "target": "GHOST WORK", "label": "PART_OF", "description": "Ghost work consisting of data refinement and moderation forms a core stage in the GAI development pipeline."}, {"source": "GAI", "target": "DEEPFAKES", "label": "PART_OF", "description": "Deepfakes are a specific output category generated by GAI systems."}, {"source": "GAI", "target": "AI COMPANIONS", "label": "PART_OF", "description": "AI companions are a commercial product manifestation of GAI technology."}, {"source": "GAI", "target": "ARTISTS", "label": "OPPOSES", "description": "Artists oppose GAI due to concerns over artistic appropriation, lack of attribution, and labor displacement."}, {"source": "GAI", "target": "SAG-AFTRA", "label": "OPPOSES", "description": "SAG-AFTRA organized a strike partly to oppose the unchecked impact of GAI on entertainment workers' employment and contracts."}, {"source": "REBECCA GIBLIN", "target": "CHOKEPOINT CAPITALISM", "label": "ADVOCATES_FOR", "description": "Rebecca Giblin co-authored Chokepoint Capitalism to advocate for structural reforms benefiting creators in corporate markets."}, {"source": "CORY DOCTOROW", "target": "CHOKEPOINT CAPITALISM", "label": "ADVOCATES_FOR", "description": "Cory Doctorow co-authored Chokepoint Capitalism to critique market structures that strip creators of copyright benefits."}, {"source": "17 U.S.C. \u00a7 112", "target": "WILLIAM PATRY", "label": "REFERENCES", "description": "William Patry references statutory rules for ephemeral copies such as those in 17 U.S.C. \u00a7 112."}, {"source": "Authors Guild", "target": "Google", "label": "OPPOSES", "description": "Authors Guild opposed Google's unauthorized digitization and online indexing of copyrighted books."}, {"source": "Google", "target": "Authors Guild v. Google, Inc.", "label": "DEFENDANT_IN", "description": "Google was the defendant in the copyright lawsuit Authors Guild v. Google, Inc."}, {"source": "Stable Diffusion", "target": "LAION 5B", "label": "PART_OF", "description": "LAION 5B forms the core training dataset underlying the Stable Diffusion generative AI system."}, {"source": "Stable Diffusion", "target": "AI-Generated Art", "label": "PART_OF", "description": "Stable Diffusion is an AI system contributing to the growing landscape of AI-generated art."}, {"source": "HIQ LABS, INC. V. LINKEDIN CORP.", "target": "LINKEDIN CORP.", "label": "DEFENDANT_IN", "description": "LinkedIn Corp was the named defendant in the HiQ Labs, Inc. v. LinkedIn Corp. legal case."}, {"source": "HIQ LABS, INC. V. LINKEDIN CORP.", "target": "WEB-SCRAPING", "label": "REFERENCES", "description": "The court case HiQ Labs, Inc. v. LinkedIn Corp. directly references and examines the legality of web-scraping."}, {"source": "HIQ LABS, INC. V. LINKEDIN CORP.", "target": "UNITED STATES COURT OF APPEALS FOR THE NINTH CIRCUIT", "label": "REFERENCES", "description": "The Ninth Circuit Court of Appeals presided over and issued a ruling in HIQ Labs, Inc. v. LinkedIn Corp."}, {"source": "HIQ LABS, INC. V. LINKEDIN CORP.", "target": "COMPUTER FRAUD AND ABUSE ACT", "label": "REFERENCES", "description": "The HIQ Labs, Inc. v. LinkedIn Corp. case evaluated whether web-scraping constitutes a violation of the Computer Fraud and Abuse Act."}, {"source": "HIQ LABS, INC.", "target": "LINKEDIN CORP.", "label": "FILED_AGAINST", "description": "HiQ Labs engaged in litigation against LinkedIn Corp concerning access for web-scraping public data."}, {"source": "UNITED STATES COURT OF APPEALS FOR THE NINTH CIRCUIT", "target": "WEB-SCRAPING", "label": "REGULATES", "description": "The Ninth Circuit Court of Appeals ruled on legal boundaries regulating public web-scraping practices."}, {"source": "WEB-SCRAPING", "target": "COMPUTER FRAUD AND ABUSE ACT", "label": "REGULATES", "description": "The Computer Fraud and Abuse Act serves as a statutory mechanism historically applied to regulate or restrict web-scraping practices."}, {"source": "WEB-SCRAPING", "target": "NET NEUTRALITY", "label": "ADVOCATES_FOR", "description": "The principle of net neutrality supports non-discriminatory treatment for all web data flow, providing a theoretical basis against restricting web-scraped data for AI."}, {"source": "U.S. Copyright Office", "target": "Copyright Registration Guidance for AI Works", "label": "REGULATES", "description": "The U.S. Copyright Office issued legal policy guidance regulating copyright registration for AI-generated works."}, {"source": "U.S. Copyright Office", "target": "Stephen Thaler", "label": "OPPOSES", "description": "Stephen Thaler challenged decisions by the U.S. Copyright Office after his copyright registration request for AI art was denied."}, {"source": "Copyright Registration Guidance for AI Works", "target": "AI-Generated Art", "label": "REGULATES", "description": "The official guidance regulates how works containing AI-generated art are evaluated for copyright protection."}, {"source": "Ahmed Elgammal", "target": "Creative Adversarial Networks", "label": "ADVOCATES_FOR", "description": "Ahmed Elgammal co-developed and authored research advocating Creative Adversarial Networks as an AI art generation model."}, {"source": "Magic: The Gathering Publisher", "target": "AI-Generated Art", "label": "REFERENCES", "description": "The publisher admitted to using AI-generated art within a promotional image."}], "communities": 71};

// ═══════════════════════════════════════════════════════════════════════════
// COLOUR MAP
// ═══════════════════════════════════════════════════════════════════════════
const COLOR_MAP = {
  ORGANIZATION: "#4ECDC4",
  PERSON:       "#FF6B6B",
  LEGISLATION:  "#60a5fa",
  LEGAL_CASE:   "#FBBF24",
  CONCEPT:      "#86efac",
  GOVERNMENT:   "#c084fc",
  AI_SYSTEM:    "#fb923c",
  OTHER:        "#94a3b8",
};

function nodeColor(type) {
  return COLOR_MAP[type] || COLOR_MAP.OTHER;
}

// ═══════════════════════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════════════════════
const svg       = d3.select("#graph");
const root      = d3.select("#root");
const tooltip   = document.getElementById("tooltip");
const container = document.getElementById("graph-container");

let W = container.clientWidth;
let H = container.clientHeight;

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on("zoom", e => root.attr("transform", e.transform));
svg.call(zoom);

// ═══════════════════════════════════════════════════════════════════════════
// FORCE SIMULATION
// ═══════════════════════════════════════════════════════════════════════════
const nodes = GRAPH_DATA.nodes.map(d => ({ ...d }));
const links = GRAPH_DATA.links.map(d => ({ ...d }));

const degreeMap = {};
links.forEach(l => {
  degreeMap[l.source] = (degreeMap[l.source] || 0) + 1;
  degreeMap[l.target] = (degreeMap[l.target] || 0) + 1;
});
nodes.forEach(n => { n.degree = degreeMap[n.id] || 1; });

const maxDeg = Math.max(...nodes.map(n => n.degree));
const minDeg = Math.min(...nodes.map(n => n.degree));
const nodeRadius = d => {
  const t = (d.degree - minDeg) / (maxDeg - minDeg || 1);
  return 8 + t * 28;
};

let simulation = d3.forceSimulation(nodes)
  .force("link",      d3.forceLink(links).id(d => d.id).distance(120))
  .force("charge",    d3.forceManyBody().strength(-300))
  .force("center",    d3.forceCenter(W / 2, H / 2))
  .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 6));

// ═══════════════════════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════════════════════
const linkGroup  = root.append("g").attr("class", "links");
const labelGroup = root.append("g").attr("class", "edge-labels");
const nodeGroup  = root.append("g").attr("class", "nodes");

const link = linkGroup.selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("marker-end", "url(#arrow)");

const edgeLabel = labelGroup.selectAll("text")
  .data(links)
  .join("text")
  .attr("class", "edge-label")
  .text(d => d.label || "");

const node = nodeGroup.selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", dragStart)
    .on("drag",  dragged)
    .on("end",   dragEnd));

node.append("circle")
  .attr("r", nodeRadius)
  .attr("fill", d => nodeColor(d.type));

node.append("text")
  .attr("dy", d => nodeRadius(d) + 11)
  .text(d => d.label.length > 20 ? d.label.slice(0, 18) + "…" : d.label)
  .style("font-size", d => d.degree > 3 ? "11px" : "9px")
  .style("opacity", d => d.degree > 2 ? 1 : 0.5);

// ═══════════════════════════════════════════════════════════════════════════
// TICK
// ═══════════════════════════════════════════════════════════════════════════
simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  edgeLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ═══════════════════════════════════════════════════════════════════════════
// TOOLTIP & INTERACTION
// ═══════════════════════════════════════════════════════════════════════════
let selectedNode = null;

node.on("mouseover", (e, d) => {
  const connections = links.filter(l =>
    l.source.id === d.id || l.target.id === d.id
  ).length;
  tooltip.innerHTML = `
    <div class="tt-name">${d.label}</div>
    <div class="tt-type" style="color:${nodeColor(d.type)}">${d.type}</div>
    ${d.description ? `<div class="tt-desc">${d.description}</div>` : ""}
    <div class="tt-connections"><span>${connections}</span> connection${connections !== 1 ? "s" : ""}</div>
  `;
  tooltip.classList.add("visible");
  positionTooltip(e);
})
.on("mousemove", positionTooltip)
.on("mouseleave", () => tooltip.classList.remove("visible"))
.on("click", (e, d) => {
  e.stopPropagation();
  selectedNode === d.id ? clearSelection() : selectNode(d);
});

svg.on("click", clearSelection);

function positionTooltip(e) {
  const rect = container.getBoundingClientRect();
  let x = e.clientX - rect.left + 14;
  let y = e.clientY - rect.top  - 10;
  if (x + 280 > W) x = e.clientX - rect.left - 280;
  tooltip.style.left = x + "px";
  tooltip.style.top  = y + "px";
}

function selectNode(d) {
  selectedNode = d.id;
  const connectedIds = new Set([d.id]);
  links.forEach(l => {
    if (l.source.id === d.id) connectedIds.add(l.target.id);
    if (l.target.id === d.id) connectedIds.add(l.source.id);
  });
  node.classed("selected", n => n.id === d.id);
  node.classed("dimmed",   n => !connectedIds.has(n.id));
  link.classed("highlighted", l => l.source.id === d.id || l.target.id === d.id);
  link.classed("dimmed",      l => l.source.id !== d.id && l.target.id !== d.id);
}

function clearSelection() {
  selectedNode = null;
  node.classed("selected dimmed", false);
  link.classed("highlighted dimmed", false);
}

// ═══════════════════════════════════════════════════════════════════════════
// DRAG
// ═══════════════════════════════════════════════════════════════════════════
function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d)  { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d)  {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ═══════════════════════════════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════════════════════════════
const typeCounts = {};
nodes.forEach(n => { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });

const hiddenTypes = new Set();
const legendEl = document.getElementById("legend");

Object.entries(COLOR_MAP).forEach(([type, color]) => {
  if (!typeCounts[type]) return;
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `
    <div class="legend-dot" style="background:${color}"></div>
    <span class="legend-name">${type}</span>
    <span class="legend-count">${typeCounts[type]}</span>
  `;
  item.addEventListener("click", () => {
    if (hiddenTypes.has(type)) {
      hiddenTypes.delete(type);
      item.classList.remove("disabled");
    } else {
      hiddenTypes.add(type);
      item.classList.add("disabled");
    }
    applyTypeFilter();
  });
  legendEl.appendChild(item);
});

function applyTypeFilter() {
  node.style("display", d => hiddenTypes.has(d.type) ? "none" : null);
  link.style("display", d => {
    const sHidden = hiddenTypes.has(d.source.type);
    const tHidden = hiddenTypes.has(d.target.type);
    return sHidden || tHidden ? "none" : null;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { clearSelection(); return; }
  const match = nodes.find(n => n.label.toLowerCase().includes(q));
  if (match) selectNode(match);
});

// ═══════════════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById("link-distance").addEventListener("input", e => {
  simulation.force("link").distance(+e.target.value);
  simulation.alpha(0.3).restart();
});

document.getElementById("charge").addEventListener("input", e => {
  simulation.force("charge").strength(+e.target.value);
  simulation.alpha(0.3).restart();
});

document.getElementById("label-threshold").addEventListener("input", e => {
  const threshold = +e.target.value;
  edgeLabel.classed("visible", d => {
    const minDeg = Math.min(d.source.degree || 1, d.target.degree || 1);
    return minDeg >= threshold;
  });
});

document.getElementById("btn-reset").addEventListener("click", () => {
  svg.transition().duration(500).call(
    zoom.transform, d3.zoomIdentity.translate(0, 0).scale(1)
  );
});

document.getElementById("btn-all").addEventListener("click", () => {
  hiddenTypes.clear();
  document.querySelectorAll(".legend-item").forEach(el => el.classList.remove("disabled"));
  applyTypeFilter();
  clearSelection();
});

// ═══════════════════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById("stat-nodes").textContent = nodes.length;
document.getElementById("stat-edges").textContent = links.length;
document.getElementById("stat-communities").textContent =
  GRAPH_DATA.communities !== undefined ? GRAPH_DATA.communities : "—";

// ═══════════════════════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════════════════════
window.addEventListener("resize", () => {
  W = container.clientWidth;
  H = container.clientHeight;
  simulation.force("center", d3.forceCenter(W / 2, H / 2));
  simulation.alpha(0.1).restart();
});
</script>
</body>
</html>
